entity_types:
  - &protein
      id: PR:000000001
      name: protein
  - &protein_complex
      id: GO:0032991
      name: protein-containing complex

eco_usage_constraints:
  - eco_id: ECO:0000353
    go_evidence: IPI
    allowed_reference: PMID:[0-9]+
    with_presence: conditional
    with_presence_condition:
      condition: db_object_type eq 'complex'
      when_false: mandatory
      when_true: optional
    with_structure: compound
    with_entities:
      - entity_type: *protein
      - entity_type: *protein_complex
  - eco_id: ECO:0000320
    go_evidence: IKR
    allowed_reference:  (GO_REF:0000(033|047))|(PMID:[0-9]+)
    with_presence: conditional
    with_presence_condition:
      condition: reference matches '^GO_REF:[0-9]{7}$'
      when_false: optional
      when_true: mandatory
  - eco_id: ECO:0000250
    go_evidence: ISS
    allowed_reference: (GO_REF:0000(024|027|110|122))|(PMID:[0-9]+)
    with_presence: mandatory
    with_structure: simple
    with_entities:
      - entity_type: *protein
    allowed_references:
      - GO_REF:0000(024|030|008|027|028|110|122)$
  - eco_id: ECO:0000501
    go_evidence: IEA
    allowed_reference:
    with_presence: mandatory
