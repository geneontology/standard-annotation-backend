- database: GO
  name: Gene Ontology Database
  rdf_uri_prefix: http://purl.obolibrary.org/obo/GO_
  generic_urls:
    - http://amigo.geneontology.org/
  entity_types:
    - type_name: molecular_function
      type_id: GO:0003674
      id_syntax: \d{7}
      example_id: GO:0004352
    - type_name: biological_process
      type_id: GO:0008150
      id_syntax: \d{7}
- database: MGI
  name: Mouse Genome Informatics
  rdf_uri_prefix: http://identifiers.org/MGI/
  generic_urls:
    - http://www.informatics.jax.org/
  synonyms:
    - MGD
  entity_types:
    - type_name: gene
      type_id: SO:0000704
      id_syntax: MGI:[0-9]+
      example_id: MGI:MGI:1345277
- database: PMID
  name: PubMed
  generic_urls:
    - http://www.ncbi.nlm.nih.gov/PubMed/
  entity_types:
    - type_name: entity
      type_id: BET:0000000
      id_syntax: '[0-9]+'
- database: CHEBI
  name: Chemical Entities of Biological Interest
  generic_urls:
    - http://www.ebi.ac.uk/chebi/
  entity_types:
    - type_name: chemical entity
      type_id: CHEBI:24431
      id_syntax: '[0-9]{1,6}'
- database: GOC
  name: Gene Ontology Consortium
  generic_urls:
    - http://geneontology.org/
