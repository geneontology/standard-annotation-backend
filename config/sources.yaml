# Reference data sources that SABE refreshes.
#
# Every entry is a source with a `type`:
#
#   github: `repository` (owner/name), `ref` (branch, tag, or commit), and a
#           relative `path`. Each refresh resolves `ref` to a commit and records it.
#   https:  `url`, which must use https.
#
# authorization
#     the single go-site users.yaml source (source key `go-site`)
#
# rules
#     the go-site repository whose metadata files GO Rules read (source key
#     `go-site`). It gives only `type: github`, `repository`, and `ref`: each
#     refresh reads db-xrefs.yaml, gorefs.yaml, groups.yaml,
#     retracted-publications.txt, eco-usage-constraints.yaml, and
#     extensions-constraints.yaml under `metadata/` at one commit.
#
# ontologies
#     keyed by ontology; `go` is required. Each entry also sets:
#       document_ontology_id  the `ontology:` header value the file must declare
#       prefixes              identifier prefixes the ontology owns; each prefix
#                             may belong to only one ontology
#       closure_predicates    relationships whose closure SABE computes; `go` must
#                             include rdfs:subClassOf. Omit for a term list.
#       required_subsets      subsets the file must declare, or the refresh fails;
#                             `go` must include the subsets GO Rules check
#                             (gocheck_do_not_annotate, gocheck_obsoletion_candidate)
#
# entities
#    keyed by a stable source key: lowercase letters, digits, `_`, or `-`, starting
#    with a letter or digit. Keys are stored with published catalogs, so
#    renaming a key retires the old catalog and publishes a new one. Removing an
#    entity source retires its catalog on the next refresh of all entity sources.
#    Entity entries may set `format: gpi`; GPI 2.0 is currently the only format.
#
# annotations
#    keyed by a stable source key. Each entry names the `group` that
#    owns its annotations; every successful refresh deletes all of that group's
#    annotations (including edits made in SABE) and imports the file. A group may have
#    only one source. Entries may set `format: gpad`; GPAD 2.0 is the only format.
#    Removing an entry stops its refreshes and leaves the group's annotations alone.

authorization:
  type: github
  repository: geneontology/go-site
  ref: master
  path: metadata/users.yaml

rules:
  type: github
  repository: geneontology/go-site
  ref: master

# The ontology list is GO, NCBITaxon (for interacting taxa), and every ontology that
# GORULE:0000058 allows in annotation extensions. GO comes from go-basic.obo because
# it has the complete inferred subclass hierarchy.
#
# ChEBI uses its lite file because it is smaller but has the same information that SABE
# needs. It also uses a direct HTTPS URL because the PURL redirects to an insecure HTTP
# URL, which SABE rejects.
ontologies:
  go:
    type: https
    url: https://current.geneontology.org/ontology/go-basic.obo
    document_ontology_id: go
    prefixes: [ GO ]
    closure_predicates: [ rdfs:subClassOf, BFO:0000050 ]
    required_subsets: [ gocheck_do_not_annotate, gocheck_obsoletion_candidate ]
  ncbitaxon:
    type: https
    url: https://purl.obolibrary.org/obo/ncbitaxon/subsets/taxslim.obo
    document_ontology_id: ncbitaxon/subsets/taxslim.obo
    prefixes: [ NCBITaxon ]
  chebi:
    type: https
    url: https://ftp.ebi.ac.uk/pub/databases/chebi/ontology/chebi_lite.obo
    document_ontology_id: chebi_lite
    prefixes: [ CHEBI ]
  pr:
    type: https
    url: https://purl.obolibrary.org/obo/pr.obo
    document_ontology_id: pr
    prefixes: [ PR ]
  uberon:
    type: https
    url: https://purl.obolibrary.org/obo/uberon/uberon-basic.obo
    document_ontology_id: uberon/uberon-basic
    prefixes: [ UBERON ]
  cl:
    type: https
    url: https://purl.obolibrary.org/obo/cl/cl-basic.obo
    document_ontology_id: cl/cl-basic
    prefixes: [ CL ]
  emapa:
    type: https
    url: https://purl.obolibrary.org/obo/emapa.obo
    document_ontology_id: emapa
    prefixes: [ EMAPA ]
  zfa:
    type: https
    url: https://purl.obolibrary.org/obo/zfa.obo
    document_ontology_id: zfa
    prefixes: [ ZFA ]
  xao:
    type: https
    url: https://purl.obolibrary.org/obo/xao.obo
    document_ontology_id: xao
    prefixes: [ XAO ]
  wbbt:
    type: https
    url: https://purl.obolibrary.org/obo/wbbt.obo
    document_ontology_id: wbbt
    prefixes: [ WBbt ]
  fbbt:
    type: https
    url: https://purl.obolibrary.org/obo/fbbt.obo
    document_ontology_id: fbbt.obo
    prefixes: [ FBbt ]
  wbls:
    type: https
    url: https://purl.obolibrary.org/obo/wbls.obo
    document_ontology_id: wbls/wbls-simple
    prefixes: [ WBls ]
  so:
    type: https
    url: https://purl.obolibrary.org/obo/so.obo
    document_ontology_id: so
    prefixes: [ SO ]

entities:
  caeel:
    type: https
    url: https://current.geneontology.org/annotations/gpi/CAEEL-mod.gpi.gz
  mouse:
    type: https
    url: https://current.geneontology.org/annotations/gpi/MOUSE-mod.gpi.gz

# WARNING: The current.geneontology.org sources are NOT good long-term sources. They are
#          species-oriented and do not map 1:1 with owning groups. A better source would
#          be the noctua_* files listed in
#          https://release.geneontology.org/2026-05-19/products/upstream_and_raw_data/index.html
#          Those files do cleanly map to groups, but they are not GPAD 2.0 conformant
#          (despite what their headers say). For example, they use `contributor` as an
#          annotation property key, but the GPAD 2.0 spec requires `contributor-id`.
#          We also would need a process to keep those files updated more regularly.
#          For now, these current.geneontology.org are used as a stopgap to allow SABE
#          to be used for testing and development.
annotations:
  mgi:
    type: https
    group: http://informatics.jax.org
    url: https://current.geneontology.org/annotations/gpad/MOUSE-mod.gpad.gz
  wormbase:
    type: https
    group: http://www.wormbase.org
    url: https://current.geneontology.org/annotations/gpad/CAEEL-mod.gpad.gz
